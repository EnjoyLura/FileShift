# FileShift 开发环境 Docker Compose
# 使用方法: docker compose -f docker/docker-compose.dev.yml up -d

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: fileshift-postgres
    environment:
      POSTGRES_DB: fileshift
      POSTGRES_USER: fileshift
      POSTGRES_PASSWORD: fileshift123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis 缓存/队列
  redis:
    image: redis:7-alpine
    container_name: fileshift-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
